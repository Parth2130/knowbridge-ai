<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — KnowBridge AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background-color: var(--bg-main); min-height: 100vh; display: flex; align-items: center; justify-content: center;">

<div class="container" style="max-width: 440px; padding: 20px;">
  <div class="text-center mb-4">
    <a href="/">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="KnowBridge AI" height="46">
    </a>
    <h4 class="fw-bold text-dark mt-3 mb-1">Welcome Back</h4>
    <p class="text-muted small">Access your team's knowledge handover workspace</p>
  </div>

  <div class="card border-0 shadow-sm rounded-4 p-4" style="background:#FFFFFF; border:1px solid var(--border-color) !important;">
    <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="loginEmail" class="form-label">Work Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i data-lucide="mail" style="width:16px;color:#718096;"></i></span>
          <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="name@company.com" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center">
          <label for="loginPassword" class="form-label">Password</label>
          <a href="#" class="small text-muted" onclick="alert('Demo notice: For demo login, use email: demo@knowbridge.ai and password: password123')">Forgot?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i data-lucide="lock" style="width:16px;color:#718096;"></i></span>
          <input type="password" class="form-control border-start-0" id="loginPassword" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-kb-primary w-100 justify-content-center py-2 mt-2">
        Sign In
      </button>
    </form>

    <div class="p-3 mt-3 rounded bg-light border text-muted small">
      <div class="fw-bold text-dark mb-1"><i data-lucide="key" style="width:13px;" class="me-1 text-primary"></i> Quick Demo Access:</div>
      <div>Email: <code>demo@knowbridge.ai</code></div>
      <div>Password: <code>password123</code></div>
    </div>
  </div>

  <div class="text-center mt-3 text-muted small">
    Don't have an account? <a href="/register" class="fw-semibold">Create an account</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
  if (window.lucide) window.lucide.createIcons();
</script>
</body>
</html>
