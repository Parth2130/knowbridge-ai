<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — KnowBridge AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background-color: var(--bg-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px 0;">

<div class="container" style="max-width: 480px; padding: 20px;">
  <div class="text-center mb-4">
    <a href="/">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="KnowBridge AI" height="46">
    </a>
    <h4 class="fw-bold text-dark mt-3 mb-1">Get Started with KnowBridge AI</h4>
    <p class="text-muted small">Prevent critical project knowledge loss across your engineering teams</p>
  </div>

  <div class="card border-0 shadow-sm rounded-4 p-4" style="background:#FFFFFF; border:1px solid var(--border-color) !important;">
    <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label for="regName" class="form-label">Full Name</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i data-lucide="user" style="width:16px;color:#718096;"></i></span>
          <input type="text" class="form-control border-start-0" id="regName" placeholder="e.g. Alex Chen" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label for="regEmail" class="form-label">Work Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i data-lucide="mail" style="width:16px;color:#718096;"></i></span>
          <input type="email" class="form-control border-start-0" id="regEmail" placeholder="alex.chen@company.com" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="regOrg" class="form-label">Organisation / Company</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i data-lucide="building" style="width:16px;color:#718096;"></i></span>
          <input type="text" class="form-control border-start-0" id="regOrg" placeholder="e.g. Acme Technologies" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="regRole" class="form-label">Role</label>
        <select class="form-select" id="regRole">
          <option value="Project Manager" selected>Project Manager</option>
          <option value="Administrator">Administrator</option>
          <option value="Team Member">Team Member</option>
        </select>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <label for="regPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required minlength="6">
        </div>
        <div class="col-6">
          <label for="regConfirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="regConfirmPassword" placeholder="••••••••" required minlength="6">
        </div>
      </div>

      <button type="submit" class="btn-kb-primary w-100 justify-content-center py-2 mt-2">
        Create Account
      </button>
    </form>
  </div>

  <div class="text-center mt-3 text-muted small">
    Already have an account? <a href="/login" class="fw-semibold">Sign in here</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
  if (window.lucide) window.lucide.createIcons();
</script>
</body>
</html>
